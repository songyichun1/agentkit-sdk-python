[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit-harness-sidecar-integration"
version = "0.1.0"
description = "Optional public AgentKit integration for managed Harness Sidecar runtimes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "agentkit-sdk-python>=0.8.2,<0.9.0",
    "pydantic>=2.11.9",
    "typer",
]

[project.entry-points."agentkit.cli_plugins"]
harness = "agentkit.extensions.harness_sidecar.cli:harness_app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentkit.extensions.harness_sidecar*"]
namespaces = true

[tool.ruff]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F401", "F811"]
